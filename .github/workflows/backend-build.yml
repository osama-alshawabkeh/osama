name: MultiChoice Backend CI

on:
  push:
    branches: ["main", "feature/**"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-build.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: backend/go.sum
      - name: Download dependencies
        run: go mod download
      - name: Run tests
        run: go test ./...
      - name: Build Linux API binary
        run: go build -trimpath -ldflags="-s -w" -o multichoice-api-linux-amd64 ./cmd/api
