name: Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          echo "y" | sdkmanager --licenses
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          sdkmanager --list_installed

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate Android manifest
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("app/src/main/AndroidManifest.xml")
          print("AndroidManifest.xml is valid")
          PY

      - name: Build debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK exists and is non-empty
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          ls -lh "$APK"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MultiChoiceMedical-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
